services:
  app:
    build: .
    container_name: tinniestudio-app
    restart: unless-stopped

    env_file:
      - .env.prod

    networks:
      - app-network

  db:
    image: postgis/postgis:16-3.4
    container_name: tinniestudio-db
    restart: always

    environment:
      POSTGRES_DB: tinniestudio_db
      POSTGRES_USER: tinniestudio_devops
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinniestudio_devops -d tinniestudio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - db_data:/var/lib/postgresql/data

    networks:
      - app-network

  nginx:
    image: nginx:stable
    container_name: tinniestudio-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: