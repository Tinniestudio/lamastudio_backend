version: "3.8"

services:
  app:
    image: lamastudio/backend:latest
    container_name: lamastudio-app-prod
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      SPRING_PROFILES_ACTIVE: prod

    depends_on:
      - proxy

    networks:
      - prod-network

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:stable
    container_name: lamastudio-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl

    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge