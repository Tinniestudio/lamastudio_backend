version: "3.8"

services:
  app:
    image: tinniestudio/backend:latest
    container_name: tinniestudio-app
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      DB_HOST: db
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app-network

  db:
    image: postgis/postgis:16-3.4
    container_name: tinniestudio-db
    restart: always

    environment:
      POSTGRES_DB: tinniestudio_db
      POSTGRES_USER: tinniestudio_devops
      POSTGRES_PASSWORD: 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

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tinniestudio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  nginx:
    image: nginx:stable
    container_name: tinniestudio-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app

    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
