version: '3.8'

# Production docker compose: only application is deployed here. The database
# is expected to be provided externally (managed DB, k8s service, or another host).
# The application will read DB connection parameters from environment or an env_file.

services:
  app:
    image: lamastudio/backend:latest
    container_name: lamastudio-app-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    # In production provide a secure env file (not checked into VCS) or environment
    env_file:
      - .env.prod
    environment:
      # These should be set in the deployment environment (or .env.prod)
      # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
      # Optionally, other secrets like JWT secrets and resend API key
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
    networks:
      - prod-network

networks:
  prod-network:
    external: true
