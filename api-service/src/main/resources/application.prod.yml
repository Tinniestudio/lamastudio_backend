spring:
  devtools:
    livereload:
      enabled: true

  config:
    import: optional:file:.env[.properties]

  application:
    name: lamastudio-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  data:
    redis:
      repositories:
        enabled: true
      url: ${REDIS_URL}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 1000ms          # don't block forever waiting for connection

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            # Updated to match application's context-path (/api/v1) and SecurityConfig redirectionEndpoint
            redirect-uri: "${APP_BASE_URL:http://localhost:8080}/api/v1/auth/oauth2/callback/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  base-url: ${APP_BASE_URL}
  frontend-url: ${FRONTEND_URL}

  resend:
    api-key: ${RESEND_API_KEY:}
    base-url: ${RESEND_BASE_URL:https://api.resend.com}
    from-email: ${RESEND_FROM_EMAIL:no-reply@yourdomain.com}

  cors:
    allowed-origins:
      - ${FRONTEND_URL}
      - ${APP_BASE_URL}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

  jwt:
    access-token:
      secret: ${JWT_ACCESS_SECRET}
      expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}        # 15 minutes
    refresh-token:
      secret: ${JWT_REFRESH_SECRET}
      expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}    # 7 days
    issuer: lamastudio

  cookie:
    secure: ${COOKIE_SECURE}    # true in production (HTTPS)
    same-site: ${COOKIE_SAME_SITE}
    domain: ${COOKIE_DOMAIN}

  email-verification:
    token-expiry-hours: 24

  password-reset:
    token-expiry-hours: 1

server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never

logging:
  level:
    com.lamastudio: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    config-url: /api/v1/api-docs/swagger-config
    url: /api/v1/api-docs
    disable-swagger-default-url: true
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
    persist-authorization: true
  show-actuator: false
  default-produces-media-type: application/json

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized