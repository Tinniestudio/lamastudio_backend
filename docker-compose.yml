services:
  app:
    build: .
    container_name: lamastudio-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Prefer a local .env for development. See .env.example for values.
    env_file:
      - .env
    environment:
      # Database connection variables expected by application.yml
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lamastudio_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db
    networks:
      - lamastudio-network

  db:
    image: postgis/postgis:16-3.4
    container_name: lamastudio-db
    restart: always
    environment:
      POSTGRES_DB: lamastudio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lamastudio-network

networks:
  lamastudio-network:
    driver: bridge

volumes:
  db_data: