spring:
  application:
    name: tinniestudio-media-worker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tinniestudio_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  flyway:
    enabled: false

worker:
  processing:
    max-job-concurrency: 2
    temp-dir: /tmp/tinniestudio
    max-duration-seconds: 14400
  ffmpeg:
    path: /usr/local/bin/ffmpeg
    ffprobe-path: /usr/local/bin/ffprobe
    hls-segment-duration: 6
    timeout-seconds: ${FFMPEG_TIMEOUT_SECONDS:1800}

app:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${STORAGE_BUCKET:tinniestudio}
    region: ${STORAGE_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}

logging:
  level:
    com.tinniestudio: INFO
